<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Título</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script src='../main.js'></script>
    <script>

        function SaveStorage(key) { // En desuso
            localStorage.setItem(key, getValue(key)); 
        }

        function CargarDatos() {

            setValue("NombreS", getValue("NombreS"));
            setValue("ContrasennaS", getValue("ContrasennaS"));
            setValue("NListaI", getValue("nlista"));
            setValue("DiaD", getValue("dia"));

            let contador = getValue("ContadorI");
            contador++;
            setValue("ContadorI", contador);
            
            let contador2 = parseInt(getValue("contador2"), 10);
            contador2 += 2;
            setValue("Contador2I", contador2);
        }

    </script>
</head>
<body onload="CargarDatos()">
    <form action="pag3.html">
        <div>
            <label>Nombre</label>
            <input type="text" name="NombreS" readonly>
        </div>
        <div>
            <label>ContrasennaS</label>
            <input type="text" name="ContrasennaS" readonly>
        </div>
        <div>
            <label>Nº Lista</label>
            <input type="number" name="NListaI" readonly>
        </div>
        <div>
            <label>Dia</label>
            <input type="date" name="DiaD" readonly>
        </div>
        <div>
            <label>Contador+1</label>
            <input type="number" name="ContadorI" readonly>
        </div>
        <div>
            <label>Contador+2</label>
            <input type="number" name="Contador2I" readonly>
        </div>
        <div>
            <label>Fecha cumple</label>
            <input type="date" name="cumple">
        </div>
        <div>
            <label>Email</label>
            <input type="text" name="email">
        </div>
        <div>
            <label>Mes actual</label>
            <input type="month" name="mes">
        </div>
        <div>
            <label>Rango</label>
            <input type="range" name="rango">
        </div>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
