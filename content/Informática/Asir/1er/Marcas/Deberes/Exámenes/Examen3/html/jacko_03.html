<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Michael Json</title>
    <script src='../scripts/main.js'></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel='stylesheet' type='text/css' media='screen' href='../style/main.css'>

    <script>

        function CargarDatos() {
            setValue("anno", getValue("anno"));
            setValue("fecha", getValue("fecha"));
        }

    </script>

</head>
<body onload="CargarDatos()">
    <h1>Biografía</h1>
    <div class="container mt-3">
        <form action="jacko_04.html">
            <div class="mb-3 mt-3">
                <label for="number">Año publicado</label>
                <input type="number" class="form-control" id="anno" name="anno" readonly>
            </div>
            <div class="mb-3 mt-3">
                <label for="fecha">Fecha título</label>
                <input type="date" class="form-control" id="fecha" name="fecha" readonly>
            </div>
            <div>
                <h3 style="text-align: center;">Rango de nivel</h3>
                <input type="range" min="0" max="200" class="form-control" id="nivel" name="nivel">
                <p style="position: absolute; left: 90%;">200</p>
                <p class="izda">0</p>
            </div>
            <div class="gal">
                <figure>
                    <img src="../img/crook-mafia-boss.gif" alt="Image 1" width="100%">
                </figure>
                <figure>
                    <img src="../img/maxresdefault.jpg" alt="Image 2" width="150%">
                </figure>
            </div>
            <button type="submit" class="btn btn-primary izda">Fin</button>
        </form>
    </div>
    <br>
</body>
</html>
