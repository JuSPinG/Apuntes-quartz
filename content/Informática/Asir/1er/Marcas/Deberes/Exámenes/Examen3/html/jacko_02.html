<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Michael Json</title>
    <script src='../scripts/main.js'></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel='stylesheet' type='text/css' media='screen' href='../style/main.css'>

    <script>

        function CargarDatos() {
            setValue("disco", getValue("disco"));
            setValue("uds", getValue("uds"));
        }

    </script>

</head>
<body onload="CargarDatos()">
    <h1>LP</h1>
    <div class="container mt-3">
        <form action="jacko_04.html">
            <div class="mb-3 mt-3">
                <label for="text">Disco</label>
                <input type="text" class="form-control" id="disco" name="disco" readonly>
            </div>
            <div class="mb-3 mt-3">
                <label for="number">Nº unidades</label>
                <input type="number" class="form-control" id="uds" name="uds" readonly>
            </div>
            <div class="mb-3 mt-3" style="margin-left: 15%;">
                <label for="number">Precio</label>
                <input type="number" class="form-control" id="precio" name="precio">
            </div>
            <div>
                <h3 style="text-align: center;">Portada de disco</h3>
                <img src="../img/Michael Jackson.webp" alt="Michael Json" class="cent">
            </div>
            <button type="submit" class="btn btn-primary izda">Fin</button>
        </form>
    </div>
    <br>
</body>
</html>
