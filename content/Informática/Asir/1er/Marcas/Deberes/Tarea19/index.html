	<input type="text" placeholder="Escribe nuevo nombre" value="Juano, el gato marihuano">

	<input type="text" placeholder="Imagen" value="https://i.etsystatic.com/11944347/r/il/d576cc/5759845341/il_fullxfull.5759845341_ab0j.jpg">

	<input type="text" placeholder="Escribe nuevo texto" value="Criatura legendaria - gato fumón">

	<input type="text" placeholder="Escribe nuevo texto" value="segundos.">

	<input type="text" placeholder="Escribe nuevo texto" value="10/10">

	<script>
		let cambiable = document.getElementsByClassName("cambiable");
		let inputs = document.getElementsByTagName("input");

		const max = Math.min(cambiable.length, inputs.length);
	  
		for (let i = 0; i < max; i++) {
		  inputs[i].addEventListener("input", () => {
				cambiable[i].textContent = inputs[i].value;
			});
		}
	  </script>
