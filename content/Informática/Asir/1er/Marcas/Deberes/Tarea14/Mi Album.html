<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Botón de Sweetalert2</title>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>
	<h1>Ejemplo de Sweetalert2</h1>
	<button onclick="mostrarNotificacion()">Mostrar notificación</button>

	<script>
		function mostrarNotificacion() {
			Swal.fire({
				title: 'Puntajes y combos',
				imageUrl: 'Info.png', // o URL externa
				showCloseButton: true, // Botón para cerrar
				confirmButtonText: 'Aceptar' // Texto del botón
			});
		}
	</script>
</body>

</html>
