<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Interactivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="shortcut icon" href="../Img/Logo.ico" type="image/x-icon">
    <style>
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1rem;
            margin: 20px;
        }
        .day {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            background-color: #407bff;
            border-radius: 5px;
            cursor: pointer;
            color: #ffffff;
        }
        .header {
            font-weight: bold;
            background-color: #007bff;

        }
        .reserved {
            background-color: #dc3545; /* Rojo para días reservados */
            color: white;
        }
    </style>
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="main.html">
                <img src="../Img/Logo.jpg" alt="Avatar Logo" style="width:60px;" class="rounded-pill"> 
            </a>
            <span class="navbar-text">Bar: El Gran Hermano</span>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="../index.html">Carta</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="Carta.html">Carta</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="Halloween.html">Halloween</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="Baile.html">Discoteca</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="Reserva.html">Reserva</a>
                </li>
          </ul>
        </div>
    </nav>
    <div class="container">
        <h1 class="text-center my-4" style="font-family: Oswald;">Sistema de Reservas</h1>
        <div class="text-center mb-4">
            <button id="prevMonth" class="btn btn-primary">Mes Anterior</button>
            <span id="currentMonth" class="mx-3"></span>
            <button id="nextMonth" class="btn btn-primary">Mes Siguiente</button>
        </div>
        <div class="calendar" id="calendar"></div>
    </div>

    <script>
        let currentDate = new Date();
        let reservations = JSON.parse(localStorage.getItem('reservations')) || {};

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            const currentMonth = document.getElementById('currentMonth');
            calendar.innerHTML = '';

            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            currentMonth.textContent = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const totalDays = lastDay.getDate();
            const startDay = firstDay.getDay();

            for (let i = 0; i < startDay; i++) {
                calendar.appendChild(document.createElement('div')).classList.add('day');
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayElement = document.createElement('div');
                dayElement.classList.add('day');
                dayElement.textContent = day;
                dayElement.dataset.date = `${year}-${month + 1}-${day}`;

                if (reservations[dayElement.dataset.date]) {
                    dayElement.classList.add('reserved');
                    dayElement.textContent += ' (Reservado)';
                }

                dayElement.addEventListener('click', () => {
                    if (!reservations[dayElement.dataset.date]) {
                        const confirmReservation = confirm(`¿Deseas reservar el ${dayElement.dataset.date}?`);
                        if (confirmReservation) {
                            reservations[dayElement.dataset.date] = true;
                            localStorage.setItem('reservations', JSON.stringify(reservations));
                            renderCalendar();
                        }
                    } else {
                        const confirmCancel = confirm(`¿Deseas cancelar la reserva del ${dayElement.dataset.date}?`);
                        if (confirmCancel) {
                            reservations[dayElement.dataset.date] = false;
                            localStorage.setItem('reservations', JSON.stringify(reservations));
                            renderCalendar();
                        }
                    }
                });

                calendar.appendChild(dayElement);
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
